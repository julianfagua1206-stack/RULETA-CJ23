<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta CJ23 - Edición Lujo & Pasión</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #07040a;
            --bg-accent: #140b1a;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa820a;
            --rose-burgundy: #2c0b16;
            --rose-accent: #b82e5a;
            --glass-bg: rgba(20, 12, 28, 0.65);
            --glass-border: rgba(212, 175, 55, 0.25);
            --glass-border-hover: rgba(212, 175, 55, 0.5);
            --text-main: #f8f6f0;
            --text-muted: rgba(248, 246, 240, 0.7);
            --julian-glow: #00d2ff;
            --carolina-glow: #ff2a85;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(ellipse at center, #180d22 0%, #07040a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 50px;
            position: relative;
        }

        /* Ambient glowing background blur effects */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(184, 46, 90, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 28px 15px 12px;
            background: linear-gradient(180deg, rgba(7, 4, 10, 0.95) 0%, transparent 100%);
            position: relative;
            z-index: 2;
        }

        .title-main {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 20%, var(--gold-light) 50%, var(--gold-primary) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(212, 175, 55, 0.3);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--gold-light);
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .controls-container {
            width: 92%;
            max-width: 480px;
            margin: 15px auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 2;
        }

        .turn-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .turn-badge {
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .turn-julian { color: var(--julian-glow); text-shadow: 0 0 12px rgba(0, 210, 255, 0.5); }
        .turn-carolina { color: var(--carolina-glow); text-shadow: 0 0 12px rgba(255, 42, 133, 0.5); }

        .btn-switch-turn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border: none;
            color: #07040a;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-switch-turn:active { transform: scale(0.94); }

        .level-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(10, 5, 16, 0.7);
            backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(184, 46, 90, 0.35));
            color: #fff;
            border: 1px solid var(--gold-primary);
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.25);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .game-section {
            display: none;
            width: 100%;
            max-width: 480px;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }
        .game-section.active { display: flex; }

        .wheel-wrapper {
            position: relative;
            width: 330px;
            height: 330px;
            margin: 20px auto;
        }

        @media (max-width: 375px) {
            .wheel-wrapper { width: 290px; height: 290px; }
        }

        .wheel-pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid var(--gold-light);
            z-index: 10;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.9));
        }

        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 25px rgba(0, 0, 0, 0.9);
            border: 5px solid var(--gold-primary);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1);
        }

        .btn-spin {
            margin-top: 22px;
            background: linear-gradient(135deg, var(--gold-primary), var(--rose-accent));
            color: #ffffff;
            border: 1px solid var(--gold-light);
            padding: 15px 45px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.35);
            letter-spacing: 1.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-spin:active { transform: scale(0.95); }

        .btn-next-level {
            margin-top: 16px;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold-light);
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-next-level:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: var(--gold-primary);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 16px;
            width: 92%;
            margin: 15px auto;
        }

        .card-item {
            height: 190px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-item.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s;
        }

        .card-front:hover {
            border-color: var(--glass-border-hover);
        }

        .card-front i {
            font-size: 2.2rem;
            color: var(--gold-primary);
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
        }

        .card-front span {
            font-size: 0.78rem;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .card-back {
            background: linear-gradient(135deg, rgba(44, 11, 22, 0.9), rgba(15, 6, 22, 0.95));
            transform: rotateY(180deg);
            border-color: var(--rose-accent);
            text-align: center;
        }

        .card-back h4 {
            font-size: 0.88rem;
            color: var(--gold-light);
            margin-bottom: 6px;
            font-family: 'Playfair Display', serif;
        }

        .card-back p {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .card-svg {
            width: 80px;
            height: 80px;
            margin: 6px 0;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.3));
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 2, 7, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(28, 14, 38, 0.95), rgba(10, 5, 16, 0.98));
            border: 1px solid var(--gold-primary);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 0 45px rgba(212, 175, 55, 0.25);
            animation: popup 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popup {
            from { transform: scale(0.82); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            color: var(--gold-light);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .modal-body {
            font-size: 1.05rem;
            color: var(--text-main);
            margin: 16px 0;
            line-height: 1.5;
            font-weight: 300;
        }

        .modal-svg-container {
            width: 170px;
            height: 150px;
            margin: 12px auto;
        }

        .timer-box {
            margin: 16px 0;
            background: rgba(10, 5, 16, 0.6);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .timer-display {
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--gold-light);
            font-family: 'Outfit', monospace;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-timer {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-main);
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-timer:active { transform: scale(0.92); }

        .btn-close-modal {
            background: linear-gradient(135deg, var(--gold-primary), var(--rose-accent));
            color: #ffffff;
            border: none;
            padding: 13px 36px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            transition: all 0.2s;
        }
        .btn-close-modal:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <header>
        <h1 class="title-main">RULETA CJ23</h1>
        <p class="subtitle">Experiencia Privada • Julián & Carolina</p>
    </header>

    <div class="controls-container">
        <div class="turn-bar">
            <div class="turn-badge" id="turnDisplay">
                <i class="fa-solid fa-crown" style="color: var(--gold-primary);"></i>
                <span id="turnText" class="turn-julian">Turno de Julián</span>
            </div>
            <button class="btn-switch-turn" onclick="switchTurn()">Cambiar Turno 🔄</button>
        </div>

        <div class="level-tabs">
            <button class="tab-btn active" onclick="setLevel(1)">Nivel 1 🥂</button>
            <button class="tab-btn" onclick="setLevel(2)">Nivel 2 🌶️</button>
            <button class="tab-btn" onclick="setLevel(3)">Nivel 3 🃏</button>
            <button class="tab-btn" onclick="setLevel(4)">Extremo 🔞</button>
        </div>
    </div>

    <div class="game-section active" id="sectionWheel">
        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="360" height="360"></canvas>
        </div>
        <button class="btn-spin" onclick="spinWheel()">GIRAR RULETA ✨</button>
        <button class="btn-next-level" id="btnNextLevel" onclick="nextLevelAuto()">Pasar al Nivel 2: Intensidad 🌡️</button>
    </div>

    <div class="game-section" id="sectionCardsLevel3">
        <div class="cards-grid" id="gridLevel3"></div>
    </div>

    <div class="game-section" id="sectionCardsExtremo">
        <div class="cards-grid" id="gridExtremo"></div>
    </div>

    <div class="modal-overlay" id="outcomeModal">
        <div class="modal-card">
            <h3 class="modal-title" id="modalTitle">RETO REVELADO</h3>
            <div class="modal-svg-container" id="modalSvgContainer" style="display:none;"></div>
            <div class="modal-body" id="modalBody">...</div>

            <div class="timer-box" id="modalTimerBox" style="display:none;">
                <div class="timer-display" id="timerDisplay">00:30</div>
                <div class="timer-controls">
                    <button class="btn-timer" onclick="startTimer()">Iniciar ▶️</button>
                    <button class="btn-timer" onclick="pauseTimer()">Pausa ⏸️</button>
                    <button class="btn-timer" onclick="resetTimer()">Reiniciar 🔄</button>
                </div>
            </div>

            <button class="btn-close-modal" onclick="closeModal()">¡Cumplido! 💖</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTickSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch(e){}
        }

        function playWinSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.12);
                    osc.stop(audioCtx.currentTime + idx * 0.12 + 0.35);
                });
            } catch(e){}
        }

        let currentLevel = 1;
        let currentTurn = 'Julián';
        let isSpinning = false;
        let timerInterval = null;
        let timerSeconds = 30;
        let initialSeconds = 30;
        let currentRotation = 0;

        const level1Options = [
            { text: "Cumplido atrevido", desc: "Hazme un cumplido picante sobre mi cuerpo o sobre algo que te vuelva loco/a de mí.", icon: "💬" },
            { text: "Rozar zona favorita (15s)", desc: "Roza suavemente con la yema de tus dedos mi parte favorita del cuerpo durante 15 segundos.", time: 15, icon: "🖐️" },
            { text: "Susurro tentador", desc: "Dile al oído a tu pareja una provocación en voz muy baja sin tocarle la boca.", icon: "👂" },

            { text: "Quítale 1 prenda a tu pareja", desc: "Escoge y retírale suavemente una prenda a tu pareja.", icon: "🖤" },
            { text: "Mirada fija (20s)", desc: "Mirarse fijamente a los ojos a muy corta distancia sin reírse ni tocarse.", time: 20, icon: "👀" },
            { text: "Beso a elección", desc: "Dale un beso sensual en la zona que tú decidas (cuello, hombro, muñeca...).", icon: "👄" },
            { text: "¡Giras de nuevo!", desc: "¡Tienes un tiro gratis inmediato! Vuelve a girar la ruleta.", icon: "🔄" },
            { text: "Paso libre", desc: "Tú eliges cuál de los retos anteriores quieres aplicarle a tu pareja en este turno.", icon: "👑" }
        ];

        const level2Options = [
            { text: "Pregunta íntima", desc: "Hazme una pregunta íntima o secreta que nunca me hayas hecho antes.", icon: "❓" },
            { text: "Fantasía al oído", desc: "Dile al oído a tu pareja la fantasía sensual que más te gustaría cumplir a su lado.", icon: "👂" },
            { text: "Quitar 1 prenda principal", desc: "Quítate una prenda clave... o quítasela a tu pareja.", icon: "👙" },
            { text: "Camino de hielo/labios (30s)", desc: "Pasa un hielo (o tus labios húmedos) desde el cuello hasta el abdomen.", time: 30, icon: "🧊" },
            { text: "Caricias a ciegas (45s)", desc: "Tu pareja cierra los ojos mientras acaricias libremente su piel.", time: 45, icon: "🙈" },
            { text: "Castigo de la Tentación (1m)", desc: "Pegados cuerpo a cuerpo en ropa interior sin poder besarse en la boca.", time: 60, icon: "⏳" },
            { text: "Besos recorridos", desc: "Besos continuos bajando lentamente por la espalda o la cintura de tu pareja.", icon: "👄" },
            { text: "Quedar en ropa interior", desc: "La persona en turno decide quién se quita su última prenda superior.", icon: "🖤" },
            { text: "Confesión picante", desc: "Cuéntale a tu pareja qué pensaste la primera vez que la/lo viste con poca ropa.", icon: "🗣️" },
            { text: "Tiro extra + Beso", desc: "Giras de nuevo inmediatamente, pero cobras un beso apasionado antes.", icon: "🔄" },
            { text: "Exploración erógena (30s)", desc: "Tocar suavemente la zona erógena preferida de tu pareja.", time: 30, icon: "🖐️" },
            { text: "Comodín Tentación", desc: "Le das una orden sensual directa a tu pareja y debe cumplirla de inmediato.", icon: "🎟️" }
        ];

        const level3CardsRaw = [
            { title: "Placer Oral (30s)", desc: "30 segundos concentrados de placer oral dedicado exclusivamente a tu pareja.", time: 30 },
            { title: "Beso Sin Manos", desc: "Dale un beso intenso a tu pareja manteniendo tus manos atadas a la espalda." },
            { title: "15s de Control Total", desc: "Tienes 15 segundos para hacer absolutamente lo que quieras con tu pareja.", time: 15 },

            { title: "Atención Erógena (45s)", desc: "Caricias y besos dedicados exclusivamente a su punto más sensible.", time: 45 },
            { title: "Toque Secreto (30s)", desc: "Caricias ultrasensibles con la yema de los dedos en muslos y cintura.", time: 30 }
        ];

        const extremoCardsRaw = [

        // Shuffle utility function to randomize card order
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const options = currentLevel === 1 ? level1Options : level2Options;
            const numOptions = options.length;
            const arcSize = (2 * Math.PI) / numOptions;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Elegant unified monochrome/bicolor palette matching the luxury theme
            for (let i = 0; i < numOptions; i++) {
                const angle = i * arcSize;
                ctx.beginPath();
                
                // Elegant alternating luxury dark tones
                if (i % 2 === 0) {
                    ctx.fillStyle = '#1e112a';
                } else {
                    ctx.fillStyle = '#2c0b16';
                }

                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 6, angle, angle + arcSize);
                ctx.lineTo(radius, radius);
                ctx.fill();

                // Gold divider line
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#f3e5ab"; // Champagne gold text
                ctx.font = "600 12.5px Outfit, sans-serif";
                const label = options[i].text;
                ctx.fillText(label.length > 18 ? label.substring(0, 16) + '..' : label, radius - 22, 4);
                ctx.restore();
            }

            // Outer ring accent
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 6, 0, 2 * Math.PI);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Center Badge
            ctx.beginPath();
            ctx.arc(radius, radius, 32, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f0817';
            ctx.fill();
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = '#f3e5ab';
            ctx.font = "700 13px Playfair Display, serif";
            ctx.textAlign = "center";
            ctx.fillText("CJ23", radius, radius + 4);
        }

        function switchTurn() {
            currentTurn = currentTurn === 'Julián' ? 'Carolina' : 'Julián';
            const textEl = document.getElementById('turnText');
            textEl.innerText = `Turno de ${currentTurn}`;
            textEl.className = currentTurn === 'Julián' ? 'turn-julian' : 'turn-carolina';
        }

        function setLevel(lvl) {
            currentLevel = lvl;
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach((btn, idx) => {
                if (idx + 1 === lvl) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            document.getElementById('sectionWheel').classList.remove('active');
            document.getElementById('sectionCardsLevel3').classList.remove('active');
            document.getElementById('sectionCardsExtremo').classList.remove('active');

            if (lvl === 1 || lvl === 2) {
                document.getElementById('sectionWheel').classList.add('active');
                drawWheel();
                document.getElementById('btnNextLevel').innerText = lvl === 1 ? "Pasar al Nivel 2: Intensidad 🌡️" : "Pasar al Nivel 3: Cartas Secretas 🃏✨";
            } else if (lvl === 3) {
                document.getElementById('sectionCardsLevel3').classList.add('active');
                renderCardsLevel3();
            } else if (lvl === 4) {
                document.getElementById('sectionCardsExtremo').classList.add('active');
                renderCardsExtremo();
            }
        }

        function nextLevelAuto() {
            if (currentLevel < 4) setLevel(currentLevel + 1);
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            initAudio();

            const options = currentLevel === 1 ? level1Options : level2Options;
            const spinRounds = 5 + Math.floor(Math.random() * 5);
            const extraDegree = Math.floor(Math.random() * 360);
            const addedDegrees = spinRounds * 360 + extraDegree;
            currentRotation += addedDegrees;

            const duration = 4000;
            const canvas = document.getElementById('wheelCanvas');
            const start = performance.now();
            let lastTickAngle = 0;

            function animate(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const currentDeg = currentRotation - addedDegrees + (easeOut * addedDegrees);

                canvas.style.transform = `rotate(${currentDeg}deg)`;

                if (currentDeg - lastTickAngle > (360 / options.length)) {
                    playTickSound();
                    lastTickAngle = currentDeg;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    playWinSound();

                    const finalDegree = currentDeg % 360;
                    const numOptions = options.length;
                    const degreesPerArc = 360 / numOptions;

                    let index = Math.floor((360 - (finalDegree % 360) + 270) % 360 / degreesPerArc);
                    index = index % numOptions;

                    showOutcome(options[index]);
                }
            }
            requestAnimationFrame(animate);
        }

        function renderCardsLevel3() {
            const grid = document.getElementById('gridLevel3');
            grid.innerHTML = '';
            // Shuffle cards every time level is opened
            const shuffledCards = shuffleArray(level3CardsRaw);
            
            shuffledCards.forEach((card, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card-item';
                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <i class="fa-solid fa-gem"></i>
                            <span>SECRETO ${idx + 1}</span>
                        </div>
                        <div class="card-back">
                            <h4>${card.title}</h4>
                            <p>${card.desc}</p>
                        </div>
                    </div>
                `;
                cardEl.onclick = () => {
                    cardEl.classList.toggle('flipped');
                    playWinSound();
                    setTimeout(() => showOutcome({ text: card.title, desc: card.desc, time: card.time }), 450);
                };
                grid.appendChild(cardEl);
            });
        }

        function renderCardsExtremo() {
            const grid = document.getElementById('gridExtremo');
            grid.innerHTML = '';
            // Shuffle cards every time level is opened
            const shuffledCards = shuffleArray(extremoCardsRaw);

            shuffledCards.forEach((card, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card-item';
                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <i class="fa-solid fa-moon"></i>
                            <span>POSICIÓN</span>
                        </div>
                        <div class="card-back">
                            <h4>${card.title}</h4>
                            ${card.svg}
                            <p style="font-size:0.65rem;">${card.desc.substring(0, 50)}...</p>
                        </div>
                    </div>
                `;
                cardEl.onclick = () => {
                    cardEl.classList.toggle('flipped');
                    playWinSound();
                    setTimeout(() => showOutcome({ text: card.title, desc: card.desc, time: card.time, svg: card.svg }), 450);
                };
                grid.appendChild(cardEl);
            });
        }

        function showOutcome(item) {
            document.getElementById('modalTitle').innerText = item.text || item.title;
            document.getElementById('modalBody').innerText = item.desc;

            const svgContainer = document.getElementById('modalSvgContainer');
            if (item.svg) {
                svgContainer.innerHTML = item.svg;
                svgContainer.style.display = 'block';
            } else {
                svgContainer.style.display = 'none';
            }

            const timerBox = document.getElementById('modalTimerBox');
            if (item.time) {
                timerBox.style.display = 'block';
                initialSeconds = item.time;
                resetTimer();
            } else {
                timerBox.style.display = 'none';
            }

            document.getElementById('outcomeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('outcomeModal').style.display = 'none';
            pauseTimer();
            switchTurn();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const secs = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        function startTimer() {
            if (timerInterval) return;
            initAudio();
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    pauseTimer();
                    playWinSound();
                    alert("¡TIEMPO CUMPLIDO! ✨");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = initialSeconds;
            updateTimerDisplay();
        }

        window.onload = () => {
            drawWheel();
        };
    </script>
</body>
